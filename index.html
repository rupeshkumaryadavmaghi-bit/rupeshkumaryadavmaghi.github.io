<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rupesh Kumar Portfolio</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2,#ff6b6b);
    background-size:400% 400%;
    animation:bg 8s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    text-align:center;
    color:white;
    padding:40px;
}

h1{
    font-size:4rem;
    margin-bottom:10px;
}

h2{
    font-size:1.5rem;
    margin-bottom:20px;
    color:#ffd369;
}

p{
    font-size:1.1rem;
    max-width:600px;
    margin:auto;
    line-height:1.8;
}

.btn{
    display:inline-block;
    margin-top:30px;
    padding:15px 35px;
    background:white;
    color:#764ba2;
    text-decoration:none;
    border-radius:50px;
    font-weight:bold;
    transition:0.3s;
}

.btn:hover{
    transform:translateY(-5px);
    background:#ffd369;
}

.social{
    margin-top:25px;
}

.social a{
    color:white;
    text-decoration:none;
    margin:0 10px;
    font-size:1.2rem;
}
</style>
</head>
<body>

<div class="container">
    <h1>Hi, I'm Rupesh Kumar</h1>
    <h2>B.Tech CSE Student</h2>

    <p>
        Welcome to my Portfolio Website.
        Passionate about Web Development, Programming,
        and Technology. Explore my projects, skills,
        and achievements.
    </p>

    <a href="#" class="btn">View Projects</a>

    <div class="social">
        <a href="#">LinkedIn</a>
        <a href="#">GitHub</a>
        <a href="#">Instagram</a>
    </div>
</div>

</body>
</html>
